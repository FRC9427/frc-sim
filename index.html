<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>你的第一場 FRC 區域賽</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#EEF2F5;--surf:#fff;--ink:#14213D;--mut:#53607A;--line:#CBD5E1;--blue:#1F5FD1;--red:#C92F29;--tape:#F2B705;--ok:#0F7A5A;--warn:#8A5A00;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--surf:#16223A;--ink:#E8EEF8;--mut:#9DABC4;--line:#2B3A57;--blue:#2F6FE0;--red:#D8453E;--ok:#4CC9A0;--warn:#F2B705}}
:root[data-theme="dark"]{--bg:#0E1626;--surf:#16223A;--ink:#E8EEF8;--mut:#9DABC4;--line:#2B3A57;--blue:#2F6FE0;--red:#D8453E;--ok:#4CC9A0;--warn:#F2B705}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.75 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 48px}
h1{font-size:1.5rem;line-height:1.3;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 18px;font-size:.95rem}
.bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--tape) 0 8px,#14213D 8px 16px);transition:width .5s}
.stages{display:flex;gap:4px;list-style:none;padding:0;margin:8px 0 22px;overflow-x:auto}
.stages li{flex:1 0 auto;font-size:.78rem;color:var(--mut);padding:2px 6px;border-bottom:2px solid transparent;white-space:nowrap}
.stages li.done{color:var(--ink)}
.stages li.now{color:var(--ink);font-weight:700;border-color:var(--tape)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:22px 20px}
.card h2{font-size:1.25rem;margin:0 0 10px;line-height:1.4}
.card p{margin:0 0 14px;max-width:38em}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:13px 15px;margin:10px 0 0;cursor:pointer;line-height:1.55}
.opt:hover{border-color:var(--blue)}
.go{font:inherit;font-weight:700;background:var(--blue);color:var(--on);border:0;border-radius:8px;padding:12px 22px;cursor:pointer;margin-top:6px}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.tag{font-size:.85rem;font-weight:700;margin:0 0 4px!important}
.t0{color:var(--ok)}.t1{color:var(--red)}.t2{color:var(--warn)}
.res{border-left:4px solid var(--ok);padding:2px 0 2px 14px;margin:0 0 14px}
.res.r1{border-color:var(--red)}.res.r2{border-color:var(--tape)}
.real{background:var(--bg);border-radius:8px;padding:12px 14px;font-size:.95rem;color:var(--mut);margin:0 0 14px}
.real strong{color:var(--ink)}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.sb div{border-radius:8px;padding:10px 14px;color:#fff;text-align:center}
.sb .me{background:var(--blue)}.sb .op{background:var(--red)}
.sb span{display:block;font-size:.82rem;opacity:.92}
.sb em{font:700 3rem/1.05 "Barlow Condensed","Noto Sans TC",sans-serif;font-style:normal}
.verdict{font-weight:700;margin:0 0 6px!important}
.rp{color:var(--mut);font-size:.9rem}
.terms{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.terms summary{cursor:pointer;color:var(--mut);font-size:.92rem}
.terms dl{margin:8px 0 0}.terms dt{font-weight:700;margin-top:8px}.terms dd{margin:0;color:var(--mut);font-size:.93rem;line-height:1.6}
ul.log{padding-left:1.2em;margin:8px 0 16px;color:var(--mut);font-size:.93rem;line-height:1.6}
h1{padding-right:96px}
.tog{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:18px;font:inherit;font-size:.85rem;color:var(--ink);background:var(--surf);border:1.5px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
.wrap{position:relative}
.ed{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:8px 12px;background:var(--bg)}
.ed summary{cursor:pointer;font-weight:700}
.fl{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 0}
.fl input,.fl textarea,.io{display:block;width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surf);border:1.5px solid var(--line);border-radius:6px;padding:7px 9px;margin-top:3px}
.fl textarea,.io{min-height:5.5em;resize:vertical}
.ch{border-top:1px dashed var(--line);margin-top:12px;padding-top:2px}
.ch b{font-size:.9rem}
.bt{font:inherit;font-size:.9rem;font-weight:700;color:var(--ink);background:var(--surf);border:1.5px solid var(--line);border-radius:8px;padding:7px 12px;margin:4px 6px 4px 0;cursor:pointer}
.msg{font-size:.9rem;color:var(--ok)}
@media (max-width:480px){.card{padding:18px 15px}.sb em{font-size:2.5rem}}
</style>
</head>
<body>
<div class="wrap">
<button class="tog" id="ed" type="button">編輯題目</button>
<h1>你的第一場 FRC 區域賽</h1>
<p class="sub">依 2026 賽季 REBUILT 比賽手冊（TU22）的規則走一場區域賽。選項的結果與回饋都對照規則。</p>
<div class="bar" aria-hidden="true"><i id="pb"></i></div>
<ol class="stages" id="st"></ol>
<main id="app"></main>
</div>

var ST=['賽前準備','檢錄','場地量測','排位賽','聯盟選擇','淘汰賽','結果'];

'Pit 規定（E101、E503、E504、E506）':'每隊有一個約 120 吋見方的 Pit。會噴火花或有明火的工具（如角磨機、焊接）不能用，走道必須暢通，所有人都要戴安全眼鏡。',
'ROBOT 重量（R103、R408）':'不含保險桿、電池與其快拆接頭，上限 115.0 磅；含保險桿上限 135.0 磅。',
'檢錄（I102–I105）':'機器必須通過完整的初次檢錄，才能打排位賽或淘汰賽。改動機器通常要重新檢錄，除非屬於 I104 列出的例外。',
'場地量測（T301）':'排位賽前場地至少開放 30 分鐘，讓隊伍量測與校正感測器。機器可以開機，但不能行駛或與場地元件互動。',

'雙敗淘汰（10.6.2）':'勝部輸一場掉到敗部，敗部再輸就出局。決賽先贏 2 場，平手不用平手規則決勝。',
'BACKUP TEAM coupon（10.6.3）':'每個聯盟 1 張，第一場淘汰賽後才能用，須在預計開賽前 2 分鐘交給裁判長，並寫明被替換的隊號。'};
var S;
function reset(){S={i:-1,r:58,p:4,a1:null,a2:null,mp:0,rp:0,w:0,l:0,ti:0,rank:0,cap:false,out:null,champ:false,pl:0,hand:0,mb:{f:1,t:0},lg:[]}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rob(sp,rel){var ok=Math.random()*100<rel;
  return {f:Math.round(sp*(ok?16:5)*(.8+.4*Math.random())),t:ok?(sp>=7?30:sp>=4?20:10):(Math.random()<.5?0:10)}}
function sum(a,m){var f=0,t=0;a.forEach(function(x){f+=x.f;t+=x.t});
  f=Math.round(f*(m?m.f:1));t+=(m?m.t:0);return {f:f,t:t,pts:f+t}}
function sim(po){
  var me=[rob(S.p,S.r)],k;
  if(po){me.push(rob(S.a1.sp,S.a1.rl));if(!S.hand)me.push(rob(S.a2.sp,S.a2.rl))}
  else for(k=0;k<2;k++)me.push(rob(3+Math.random()*5,80));
  var op=[];for(k=0;k<3;k++)op.push(rob(3+Math.random()*5+(po||0),85));
  var A=sum(me,S.mb),B=sum(op);S.mb={f:1,t:0};S.hand=0;
  var w=A.pts>B.pts,t=A.pts===B.pts,d=[w?'勝 3':t?'平 1':'敗 0'],rp=w?3:t?1:0;
  if(A.f>=100){d.push('ENERGIZED 1');rp++}
  if(A.f>=360){d.push('SUPERCHARGED 1');rp++}
  if(A.t>=50){d.push('TRAVERSAL 1');rp++}
  return {me:A,op:B,w:w,t:t,rp:rp,d:d}}
function nos(){return {me:{pts:0,f:0,t:0},op:{pts:70+Math.round(Math.random()*40),f:0,t:0},w:false,t:false,rp:0,d:['未到場或 DQ 0']}}
function aq(m){S.mp++;S.rp+=m.rp;if(m.w)S.w++;else if(m.t)S.ti++;else S.l++}
function auto(n){for(var k=0;k<n;k++)aq(sim(0))}
function board(m,q){
  var h='<div class="sb"><div class="me"><span>我方聯盟</span><em>'+m.me.pts+'</em></div><div class="op"><span>對手聯盟</span><em>'+m.op.pts+'</em></div></div>';
  h+='<p class="verdict">'+(m.w?'這場獲勝。':m.t?'平手。':'這場落敗。')+'</p>';
  h+='<p class="rp">我方 FUEL '+m.me.f+' 分、TOWER '+m.me.t+' 分'+(q?'。本場 RP：'+m.d.join(' ＋ ')+' ＝ '+m.rp:'')+'</p>';
  return h}

 c:[{l:'改用手鋸與銼刀處理，請訪客退出走道並戴上安全眼鏡',d:{r:6},v:0,res:'支架修好了，Pit 也沒有被工作人員糾正。',real:'E504 禁止會噴火花或產生明火的工具，手冊明確點名角磨機。E101 要求所有人戴安全眼鏡，E503 要求走道暢通。小型、有護罩的桌上型機具則是允許的。'},
  {l:'在 Pit 裡直接用角磨機，快一點修好',d:{r:-6},v:1,res:'工作人員要求你們撤走工具，修理被迫中斷，時間白白流失。',real:'違反 E504。不安全或超出規格的項目，FIRST 人員或活動方可以要求移除。需要這類加工時，要使用活動提供的機械加工區（若有）。'},
  {l:'把機器推到走道上空間大的地方修',d:{r:-3},v:1,res:'走道被擋住，別隊的機器與推車過不去，工作人員請你們退回 Pit。',real:'違反 E503（走道必須暢通）與 E502（設備應完整擺在自己的 Pit 範圍內）。'}]},
{st:1,t:'檢錄：重量',terms:['ROBOT 重量（R103、R408）','檢錄（I102–I105）'],
 x:'手冊規定，機器必須通過完整的初次檢錄，才能打排位賽並拿到 RP（I102）。檢錄員量出：不含保險桿與電池是 115.8 磅，含保險桿是 133.5 磅。',
 c:[{l:'拆掉一個不影響核心功能的支架，再重新過磅',d:{r:3},v:0,res:'重新量到 114.9 磅，通過重量檢查。',real:'R103 上限是 115.0 磅，保險桿與電池不計入。含保險桿的上限是 135.0 磅（R408），你們這項合格，問題只在 R103。'},
  {l:'把保險桿和電池拿掉，再量一次',d:{r:-2},v:2,res:'數字沒變，還是 115.8 磅，時間白花了。',real:'R103 已經把保險桿、電池與其快拆接頭排除在外，拿掉它們不會改變結果。要減的是機器本體。'},

function persist(){draft=dump();try{localStorage.setItem(K,JSON.stringify(draft))}catch(e){}}
try{var sv=localStorage.getItem(K);if(sv){draft=JSON.parse(sv);load(draft)}}catch(e){}
try{fetch('questions.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&load(j)&&draft)load(draft)}).catch(function(){})}catch(e){}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e}
function fld(par,label,get,set,multi){var l=mk('label','fl',label),e=document.createElement(multi?'textarea':'input');
  e.value=get();e.oninput=function(){set(cl(e.value));persist()};l.appendChild(e);par.appendChild(l)}
function btn(par,txt,fn){var b=mk('button','bt',txt);b.type='button';b.onclick=fn;par.appendChild(b);return b}
function editView(msg){
  editing=true;sc=null;head();document.getElementById('ed').textContent='回到遊玩';
  app.innerHTML='';var card=mk('div','card');card.appendChild(mk('h2','','編輯題目文字'));
  card.appendChild(mk('p','','這裡只能改文字，計分、機率與規則判定不會變。文字中的 {rank}、{rp}、{rs}、{record}、{capnote}、{picknote}、{bracket}、{result} 會在遊玩時自動換成實際內容，可以保留、移動或刪除。修改會自動存在這個瀏覽器裡。要讓所有人看到，請按「下載題目檔」，用它取代專案裡的 questions.json。'));
  var bar=mk('div');
  btn(bar,'複製全部文字',function(){var t=JSON.stringify(pack(),null,1),a=mk('textarea','io');a.readOnly=true;a.value=t;
    io.innerHTML='';io.appendChild(mk('p','','全選複製下面的內容，貼進 questions.json。'));io.appendChild(a);
    btn(io,'複製',function(){try{navigator.clipboard.writeText(t).then(function(){m2.textContent='已複製。'},function(){a.select();m2.textContent='請手動複製。'})}catch(e){a.select();m2.textContent='請手動複製。'}});a.select()});
  btn(bar,'貼上文字',function(){var a=mk('textarea','io');a.placeholder='貼上之前匯出的內容';io.innerHTML='';io.appendChild(a);
    btn(io,'套用',function(){try{if(load(JSON.parse(a.value))){persist();editView('已套用。')}else m2.textContent='格式不對。'}catch(e){m2.textContent='格式不對，請確認內容完整。'}})});
  var fi=document.createElement('input');fi.type='file';fi.accept='.json,application/json';fi.style.display='none';
  fi.onchange=function(){var f=fi.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{if(load(JSON.parse(rd.result))){persist();editView('已載入 '+f.name+'。')}else m2.textContent='格式不對。'}catch(e){m2.textContent='格式不對，請確認是題目檔。'}};rd.readAsText(f)};
  btn(bar,'載入題目檔',function(){fi.click()});
  btn(bar,'下載題目檔',function(){var b=new Blob([JSON.stringify(pack(),null,1)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='questions.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},500)});
  btn(bar,'還原預設',function(){try{localStorage.removeItem(K)}catch(e){}location.reload()});
  card.appendChild(bar);var io=mk('div'),m2=mk('p','msg',msg||'');card.appendChild(io);card.appendChild(m2);
  SC.forEach(function(s,i){var d=mk('details','ed'),sm=mk('summary','',(i+1)+'. '+s.t);d.appendChild(sm);
    fld(d,'標題',function(){return s.t},function(v){s.t=v;sm.textContent=(i+1)+'. '+v});
    fld(d,'情境說明',function(){return s.x},function(v){s.x=v},true);
    (s.c||[]).forEach(function(c,j){var g=mk('div','ch');g.appendChild(mk('b','','選項 '+(j+1)));
      fld(g,'選項文字',function(){return c.l},function(v){c.l=v});
      fld(g,'選了之後的結果',function(){return c.res},function(v){c.res=v},true);
      fld(g,'規則依據與說明',function(){return c.real},function(v){c.real=v},true);
      if(c.alt){var al=c.alt.c;fld(g,'（偶發結果）發生時的結果',function(){return al.res},function(v){al.res=v},true);
        fld(g,'（偶發結果）規則依據與說明',function(){return al.real},function(v){al.real=v},true)}
      d.appendChild(g)});
    card.appendChild(d)});
  app.appendChild(card);window.scrollTo(0,0)}
document.getElementById('ed').onclick=function(){if(editing){editing=false;this.textContent='編輯題目';reset();intro()}else editView()};
reset();intro();
</script>
</body>
</html>
